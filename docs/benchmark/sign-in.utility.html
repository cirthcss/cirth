<article class="max-w-sm rounded-xl border border-zinc-200 bg-white p-6 shadow-sm dark:border-zinc-800 dark:bg-zinc-900">
  <h2 class="mb-6 text-2xl font-semibold text-zinc-900 dark:text-white">Sign in</h2>
  <form class="grid gap-4">
    <label class="grid gap-1.5 text-sm font-medium text-zinc-700 dark:text-zinc-300">
      Email
      <input type="email" required class="rounded-md border border-zinc-300 bg-white px-3 py-2 text-base text-zinc-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-600 user-invalid:border-red-600 dark:border-zinc-700 dark:bg-zinc-950 dark:text-white">
    </label>
    <label class="grid gap-1.5 text-sm font-medium text-zinc-700 dark:text-zinc-300">
      Password
      <input type="password" required class="rounded-md border border-zinc-300 bg-white px-3 py-2 text-base text-zinc-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-600 user-invalid:border-red-600 dark:border-zinc-700 dark:bg-zinc-950 dark:text-white">
    </label>
    <label class="flex items-center gap-2 text-sm text-zinc-700 dark:text-zinc-300">
      <input type="checkbox" checked class="size-4 accent-violet-600">
      Remember me
    </label>
    <button class="rounded-md bg-violet-600 px-4 py-2 font-medium text-white hover:bg-violet-700 active:bg-violet-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-600">Sign in</button>
  </form>
</article>
