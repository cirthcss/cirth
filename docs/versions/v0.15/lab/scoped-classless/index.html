<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Scoped classless build — authentic Cirth output</title>
		<script>
			// Documentation-only enhancement: the stylesheet below remains the
			// real Cirth build and the complete UI is readable without JavaScript.
			// This script only mirrors the requested light/dark scheme before paint.
			(function () {
				var requested = new URLSearchParams(location.search).get("theme");
				document.documentElement.setAttribute(
					"data-theme",
					requested === "dark" ? "dark" : "light",
				);
			})();
		</script>
		<link rel="stylesheet" href="/cirth/v0.15/styles/generated/cirth-lab-scoped-classless.css">

			<article>
				<h2>Sign in</h2>

						Email
						<input type="email" name="email" autocomplete="email" required="">
					</label>

					</label>
