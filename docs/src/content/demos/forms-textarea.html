<label>
  Message
  <textarea name="message" placeholder="What can we help with?" maxlength="500" aria-describedby="textarea-message-help"></textarea>
  <small id="textarea-message-help">Up to 500 characters.</small>
</label>
<label>
  Short note
  <textarea name="note" rows="2">Two rows, because the rows attribute says so.</textarea>
</label>
<label>
  Terms
  <textarea name="terms" rows="2" readonly>Read-only: selectable, not editable.</textarea>
</label>
