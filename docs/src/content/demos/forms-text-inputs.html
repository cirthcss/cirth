<div class="grid">
  <label>
    Username
    <input type="text" name="username" placeholder="ada" autocomplete="username">
  </label>
  <label>
    Email
    <input type="email" name="email" placeholder="ada@example.com" autocomplete="email">
  </label>
</div>
<div class="grid">
  <label>
    Password
    <input type="password" name="password" autocomplete="new-password">
  </label>
  <label>
    Website
    <input type="url" name="website" placeholder="https://">
  </label>
</div>
<div class="grid">
  <label>
    Phone
    <input type="tel" name="phone" autocomplete="tel">
  </label>
  <label>
    Seats
    <input type="number" name="seats" value="5" min="1" max="50">
  </label>
</div>
<label>
  Postcode
  <input type="text" name="postcode" size="8" autocomplete="postal-code">
</label>
