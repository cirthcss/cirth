<label>
  Country
  <select name="country" autocomplete="country" required>
    <option value="" selected disabled>Choose a country…</option>
    <option value="it">Italy</option>
    <option value="fr">France</option>
    <option value="de">Germany</option>
  </select>
</label>
<label>
  Time zone
  <select name="timezone">
    <optgroup label="Europe">
      <option>Rome</option>
      <option selected>London</option>
    </optgroup>
    <optgroup label="Americas">
      <option>New York</option>
      <option>São Paulo</option>
    </optgroup>
  </select>
</label>
<label>
  Notify me about
  <select name="topics" multiple size="4">
    <option selected>Releases</option>
    <option>Security advisories</option>
    <option selected>Breaking changes</option>
    <option>Community events</option>
  </select>
</label>
