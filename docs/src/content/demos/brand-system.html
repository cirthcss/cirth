<article>
  <header>
    <hgroup>
      <h3>Release notes</h3>
      <p>Version 0.16, for the default theme</p>
    </hgroup>
  </header>
  <p>
    A heading is a title, a paragraph is body text and a field's label is a
    label. The accent marks what you can act on: a
    <a href="/customization">link in running text</a>, the primary action,
    the option that is checked.
  </p>
  <label for="brand-system-email">Email for the next release</label>
  <input id="brand-system-email" type="email" placeholder="you@example.com" autocomplete="email" />
  <small>Sent once, on the day it is published.</small>
  <fieldset>
    <legend>Include</legend>
    <label><input type="checkbox" name="brand-system-include" checked /> Breaking changes</label>
    <label><input type="checkbox" name="brand-system-include" /> Documentation updates</label>
  </fieldset>
  <footer>
    <button type="button">Subscribe</button>
    <button type="button" class="secondary">Not now</button>
  </footer>
</article>
