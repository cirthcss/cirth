<fieldset>
  <legend>Checkboxes</legend>
  <label>
    <input type="checkbox" name="options" value="checked" checked>
    Checked
  </label>
  <label>
    <input type="checkbox" name="options" value="unchecked">
    Unchecked
  </label>
</fieldset>

<fieldset>
  <legend>Radios</legend>
  <label>
    <input type="radio" name="radio" value="a" checked>
    Option A
  </label>
  <label>
    <input type="radio" name="radio" value="b">
    Option B
  </label>
</fieldset>

<fieldset>
  <legend>Switch</legend>
  <label>
    <input type="checkbox" name="notifications" role="switch" checked>
    Enable notifications
  </label>
</fieldset>
