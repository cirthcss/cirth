<article>
  <header>
    <hgroup>
      <h2>Sign in</h2>
      <p>Welcome back to Northwind.</p>
    </hgroup>
  </header>
  <form>
    <label>
      Email
      <input type="email" name="email" autocomplete="email" required>
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required aria-describedby="ex-sign-in-help">
      <small id="ex-sign-in-help"><a href="#">Forgot your password?</a></small>
    </label>
    <label>
      <input type="checkbox" role="switch" name="remember" checked>
      Keep me signed in
    </label>
    <button type="submit">Sign in</button>
  </form>
  <footer>
    <small>New here? <a href="#">Create an account</a></small>
  </footer>
</article>
