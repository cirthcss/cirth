name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint SCSS
        run: npm run lint

      - name: Build CSS
        run: npm run build

      - name: Check CSS size budget
        run: npm run check:size

      - name: Check dist invariants
        run: npm run check:dist

      - name: Build docs
        run: npm run docs:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # --retries=2, for the same reason the baseline workflow uses it: a
      # WebKit flake failing the whole run is worse than a flake, and it
      # stops the release pipeline over something that passes on the next
      # attempt. A deterministic failure still fails all three times.
      #
      # The other half of --retries is the step below. A run that goes
      # green while something in it is unreliable hides the unreliability,
      # so every test that needed a retry is named and annotated on its own
      # file and line.
      - name: Browser interaction regression tests
        run: >
          npx playwright test --config=playwright.behavior.config.js
          --retries=2 --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .cache/behavior-report.json

      - name: Name any test that needed a retry
        if: always()
        run: node scripts/report-flaky.js .cache/behavior-report.json

      - name: Check all themes accessibility (axe, WCAG 2.0–2.2 A/AA)
        run: npm run check:a11y

      # Visual baselines are Git LFS objects and platform-specific (font
      # rendering differs between macOS and Linux); checkout leaves LFS
      # pointers, so fetch just the Linux set, cached by content so
      # steady-state runs use no LFS bandwidth. The update-visual-baselines
      # workflow generates and commits the Linux set automatically when
      # it is missing.
      - name: List Linux visual baseline objects
        run: >
          git lfs ls-files -l -I 'tests/__screenshots__/*-linux/**'
          | awk '{print $1}' | sort > .lfs-baseline-oids

      - name: Cache LFS baseline objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-visual-${{ hashFiles('.lfs-baseline-oids') }}

      - name: Pull Linux visual baselines
        run: |
          git lfs install --local
          git lfs pull -I 'tests/__screenshots__/*-linux/**'

      - name: Visual regression (Playwright screenshot diff)
        run: |
          if ls tests/__screenshots__ 2>/dev/null | grep -q -- '-linux$'; then
            npm run check:visual
          else
            echo "::notice::No Linux visual baselines committed yet — the update-visual-baselines workflow will generate and commit them."
          fi

      # `npm pack --dry-run` used to run here and prove only that packing
      # did not crash. These two assert the result: that the tarball holds
      # exactly the build's output plus its metadata, and that a clean
      # project can install it and reach every documented entry point.
      # check:tooling had never run anywhere but a developer machine, which
      # is how the v0.15.0-beta.1 publish discovered it needs a browser.
      # Here the browsers are already installed, so it costs seconds.
      - name: Check tooling
        run: npm run check:tooling

      - name: Check package contents
        run: npm run check:package

      - name: Install the tarball into a clean project
        run: npm run check:consumer

      - name: Check tracked files
        run: git diff --exit-code
