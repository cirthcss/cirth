name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint SCSS
        run: npm run lint

      - name: Build CSS
        run: npm run build

      - name: Check CSS size budget
        run: npm run check:size

      - name: Check dist invariants
        run: npm run check:dist

      - name: Check custom property prefix build
        run: npm run check:prefix

      - name: Build docs
        run: npm run docs:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check the DTCG token export against three engines
        run: npm run check:tokens

      # --retries=2, for the same reason the baseline workflow uses it: a
      # WebKit flake failing the whole run is worse than a flake, and it
      # stops the release pipeline over something that passes on the next
      # attempt. A deterministic failure still fails all three times.
      #
      # The other half of --retries is the step below. A run that goes
      # green while something in it is unreliable hides the unreliability,
      # so every test that needed a retry is named and annotated on its own
      # file and line.
      - name: Browser interaction regression tests
        run: >
          npx playwright test --config=playwright.behavior.config.js
          --retries=2 --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .cache/behavior-report.json

      - name: Name any test that needed a retry
        if: always()
        run: node scripts/report-flaky.js .cache/behavior-report.json

      - name: Check all themes accessibility (axe, WCAG 2.0–2.2 A/AA)
        run: npm run check:a11y

      # Visual baselines are platform-specific (font rendering differs
      # between macOS and Linux) and live outside Git, as assets of the
      # visual-baselines pre-release; tests/visual-baselines.json pins the
      # set this commit compares against (scripts/visual-baselines.js).
      # Fetch just the Linux sets, cached by their digests, so a run whose
      # baselines did not move downloads nothing. The update-visual-baselines
      # workflow generates, uploads and pins the Linux sets when they are
      # missing or stale.
      - name: Key the Linux visual baselines
        run: |
          mkdir -p .cache
          node scripts/visual-baselines.js key --platform linux > .cache/visual-baselines.key

      - name: Cache Linux visual baselines
        uses: actions/cache@v4
        with:
          path: tests/__screenshots__
          key: visual-baselines-linux-${{ hashFiles('.cache/visual-baselines.key') }}
          restore-keys: visual-baselines-linux-

      - name: Pull Linux visual baselines
        run: node scripts/visual-baselines.js pull --platform linux

      - name: Visual regression (Playwright screenshot diff)
        run: |
          if ls tests/__screenshots__ 2>/dev/null | grep -q -- '-linux$'; then
            npm run check:visual
          else
            echo "::notice::No Linux visual baselines committed yet — the update-visual-baselines workflow will generate and commit them."
          fi

      # `npm pack --dry-run` used to run here and prove only that packing
      # did not crash. These two assert the result: that the tarball holds
      # exactly the build's output plus its metadata, and that a clean
      # project can install it and reach every documented entry point.
      # check:tooling had never run anywhere but a developer machine, which
      # is how the v0.15.0-beta.1 publish discovered it needs a browser.
      # Here the browsers are already installed, so it costs seconds.
      - name: Check tooling
        run: npm run check:tooling

      - name: Check package contents
        run: npm run check:package

      - name: Install the tarball into a clean project
        run: npm run check:consumer

      - name: Check tracked files
        run: git diff --exit-code
