# Generates and commits the Linux visual-regression baselines that CI
# compares against (screenshot baselines are platform-specific and live
# in Git LFS — see playwright.config.js). Runs unconditionally on every
# push that touches something able to change rendered output, and
# commits only if the regenerated screenshots actually differ — so it
# self-heals both a first-time bootstrap (no Linux baselines yet) and
# partial staleness (e.g. only one page's content changed), with no
# manual "delete the Linux baselines" step required on the contributor's
# side. workflow_dispatch runs it unconditionally, path filters aside
# (available once this file is on the default branch).
#
# The commit is pushed back to the same branch as github-actions[bot].
# Pushes made with the workflow token do not retrigger workflows, so
# this cannot loop. Because this runs as a second, async workflow
# alongside CI, a content change and its matching Linux baseline update
# land as two separate commits — CI's check:visual step on the
# content-change push itself may still fail against the now-stale
# baseline; the follow-up bot commit resolves it.
name: Update visual baselines

on:
  push:
    branches:
      - "**"
    paths:
      - "src/**"
      - "docs/**"
      - "scripts/build*.js"
      - "scripts/lib/**"
      - "tests/visual.spec.js"
      - "playwright.config.js"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Regenerate Linux baselines
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build CSS
        run: npm run build

      - name: Build docs
        run: npm run docs:build

      - name: Regenerate baselines
        run: npx playwright test --update-snapshots

      # The push races anything else landing on the branch: regenerating
      # hundreds of screenshots takes minutes, and a second push in that
      # window leaves this one pushing from a stale base. It used to just fail,
      # which is indistinguishable from a real breakage at a glance and leaves the
      # baselines unwritten — so a branch that had moved once stayed stale
      # until someone pushed again.
      #
      # Rebasing and retrying is correct whichever way the race went. If the
      # newer commits did not change rendered output, these baselines are
      # still the right ones for the new head. If they did, a second run is
      # already queued for that push and will overwrite them — pushing
      # slightly stale baselines in the meantime is no worse than the
      # already-documented window where CI compares against baselines the
      # follow-up commit has not caught up with yet.
      #
      # -X theirs resolves against the commit being replayed, which during a
      # rebase is ours: two runs racing means the later regeneration wins,
      # which is the one that saw the newer content.
      - name: Commit and push baselines
        run: |
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__

          if git diff --cached --quiet; then
            echo "Baselines unchanged — nothing to commit."
            exit 0
          fi

          git commit -m "test: regenerate Linux visual baselines"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi

            echo "Push rejected (attempt $attempt) — the branch moved. Rebasing."
            git fetch origin "${{ github.ref_name }}"

            if ! git rebase -X theirs "origin/${{ github.ref_name }}"; then
              git rebase --abort || true
              echo "::error::Could not rebase the baseline commit onto the branch."
              exit 1
            fi
          done

          echo "::error::Still could not push after three attempts."
          exit 1
