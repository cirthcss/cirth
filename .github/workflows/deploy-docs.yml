name: Deploy docs

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest

    steps:
      # master, whichever branch triggered this: the root of the site is
      # always the released version. A push to develop gets here too, but
      # only to refresh the preview built below.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Build docs
        run: npm run docs:build
        env:
          GITHUB_PAGES: true

      # Pages publishes one artifact, so the released site and the preview of
      # the unreleased branch are assembled together rather than racing each
      # other for the same deployment. The root is always master — what is on
      # npm — and develop is built beside it under /next/, where the banner
      # says so. A push to either branch rebuilds both, so neither goes stale
      # while the other moves.
      - name: Build the unreleased preview
        run: |
          git fetch origin develop
          git worktree add --detach ../next origin/develop
          cd ../next
          npm ci
          npm run build
          npm run docs:build
          cd -
          cp -R ../next/docs/dist docs/dist/next
        env:
          GITHUB_PAGES: true
          DOCS_VARIANT: next

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
